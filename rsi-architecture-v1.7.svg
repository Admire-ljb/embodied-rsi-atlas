  <title id="title">具身智能体 RSI 组件与协作关系</title>
  <desc id="desc">进化面将候选送交控制面验证。获准版本下发执行面，智能体通过工具网关访问环境。运行证据拼接为轨迹，回到进化面。改进器的新版也经控制面放行。</desc>
